name: Python tests
on:
  push:
    branches: [master, 'feature/price-filters-and-coverage-20261118']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Live Iggy, Chelsea food and Tweed collection (network-dependent)
        if: github.ref == 'refs/heads/feature/price-filters-and-coverage-20261118'
        continue-on-error: true
        run: python -m monitor.cli collect --only iggy_pub ed_28 mp_4602 ed_3832
      - name: Show latest collector log
        if: always() && github.ref == 'refs/heads/feature/price-filters-and-coverage-20261118'
        run: if [ -f data/monitor.log ]; then tail -n 35 data/monitor.log; fi

  live-audit:
    if: github.ref == 'refs/heads/feature/price-filters-and-coverage-20261118' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            pub_ids: "dubliner mp_4652 mp_284 mp_243 ed_28 ed_3686"
          - shard: 2
            pub_ids: "tap_barrel mp_26 mp_4591 mp_4602 ed_4252 ed_3928"
          - shard: 3
            pub_ids: "delirium mp_27 mp_395 mp_24 ed_3586 ed_3637"
          - shard: 4
            pub_ids: "beeftime mp_23 mp_4601 mp_4589 ed_2453 iggy_pub"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Fetch complete menu source shard
        run: |
          set +e
          python -m monitor.cli collect --only ${{ matrix.pub_ids }}
          echo "Collector exit code: $?"
          exit 0
      - name: Print machine-readable source statuses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          results=sorted(Path("data/snapshots").glob("*/run.json"))
          if not results:
              raise SystemExit("No collector results")
          data=json.loads(results[-1].read_text(encoding="utf-8"))
          for x in data:
              print("AUDIT_RESULT "+json.dumps(x,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-shard-${{ matrix.shard }}
          path: data/snapshots/**/run.json
          retention-days: 7
