name: Python tests
on:
  push:
    branches: [master, 'feature/price-filters-and-coverage-20261118', 'feature/easypub-khodynka-20261119']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Live Iggy, Chelsea food and Tweed collection (network-dependent)
        if: github.ref == 'refs/heads/feature/price-filters-and-coverage-20261118'
        continue-on-error: true
        run: python -m monitor.cli collect --only iggy_pub ed_28 mp_4602 ed_3832
      - name: Test live Easy Pub official delivery menu
        if: github.ref == 'refs/heads/feature/easypub-khodynka-20261119'
        continue-on-error: true
        run: python -m monitor.cli collect --only easy_pub_khodynka
      - name: Show latest collector log
        if: always() && github.ref == 'refs/heads/feature/price-filters-and-coverage-20261118'
        run: if [ -f data/monitor.log ]; then tail -n 35 data/monitor.log; fi

